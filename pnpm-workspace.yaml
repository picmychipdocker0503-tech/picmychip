allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  '@vercel/git-hooks': true
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Forces known-vulnerable transitive dependencies (pulled in deep inside
# @payloadcms/* and its own deps) up to their patched versions, without
# waiting on upstream to bump them. Re-run `pnpm audit` after any dependency
# update to confirm these are still the minimum safe versions.
overrides:
  brace-expansion: '>=1.1.18'
  dompurify: '>=3.4.13'
  esbuild: '>=0.24.3'
  fast-uri: '>=3.1.5'
  # image-size: advisory (GHSA) claims a fix in >=2.0.3, but nothing past
  # 2.0.2 is published on npm yet — nothing to override to. Revisit once
  # upstream actually ships a patched release.
  js-yaml: '>=4.3.1'
  nanoid: '>=3.3.17'
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'
  undici: '>=7.29.0'
  vitest: '>=4.1.0'
