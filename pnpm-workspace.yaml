allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  # false, not true: its postinstall symlinks git hooks, which fails with
  # EPERM on Windows without Developer Mode/admin rights and aborts the
  # whole `pnpm install` before it finishes relinking anything else.
  '@vercel/git-hooks': false
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Forces known-vulnerable transitive dependencies (pulled in deep inside
# @payloadcms/* and its own deps) up to their patched versions, without
# waiting on upstream to bump them. Re-run `pnpm audit` after any dependency
# update to confirm these are still the minimum safe versions.
overrides:
  brace-expansion: '>=1.1.18'
  dompurify: '>=3.4.13'
  # Exact pin, not a range — @payloadcms/db-postgres bundles its own nested
  # drizzle-orm copy, and without forcing a single version pnpm can resolve
  # two separate instances. Structurally identical but different module
  # instances, which TypeScript treats as incompatible types (SQL<unknown>
  # from one instance isn't assignable to SQLWrapper from the other),
  # breaking `tsc`/`next build` on migration files that call db.execute(sql`...`).
  drizzle-orm: '0.45.2'
  esbuild: '>=0.24.3'
  fast-uri: '>=3.1.5'
  # image-size: advisory (GHSA) claims a fix in >=2.0.3, but nothing past
  # 2.0.2 is published on npm yet — nothing to override to. Revisit once
  # upstream actually ships a patched release.
  js-yaml: '>=4.3.1'
  nanoid: '>=3.3.17'
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'
  # Capped below 8.0.0 — jsdom (pulled in by vitest 4.1's jsdom@28) requires
  # undici ^7.20.0 and calls an internal path (lib/handler/wrap-handler.js)
  # that undici 8 removed; the open-ended '>=7.29.0' let pnpm's override
  # float every resolution in the tree to 8.10.0, breaking jsdom's require.
  undici: '>=7.29.0 <8.0.0'
  vitest: '>=4.1.0'
